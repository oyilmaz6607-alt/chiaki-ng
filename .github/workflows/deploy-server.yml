# AltyazıTR Pro çeviri sunucusu — test + Cloudflare Workers dağıtımı.
# Actions > "Sunucu (AltyazıTR Pro)" > "Run workflow" ile elle başlatılır; main'e server/ değişikliği
# gelince de çalışır. CLOUDFLARE_API_TOKEN gizli değeri yoksa yalnızca testler çalışır, dağıtım atlanır.
# Kurulum: server/KURULUM.md
name: Sunucu (AltyazıTR Pro)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  WRANGLER: wrangler@3.114.0
  KV_TITLE: altyazitr-api-ALTYAZI_KV

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testler
        run: node server/test/run.mjs

      - name: Cloudflare ayarı yok — dağıtım atlandı
        if: env.HAS_CF != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN gizli değeri yok; yalnızca testler çalıştı. Kurulum için server/KURULUM.md"

      - name: Hesap kimliğini kontrol et
        if: env.HAS_CF == 'true'
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID gizli değeri eksik (KURULUM.md, adım A)."; exit 1
          fi

      # KV alanını bul ya da oluştur; kimliğini wrangler.toml'a yaz.
      - name: KV alanı (ALTYAZI_KV)
        if: env.HAS_CF == 'true'
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -fsS -H "$AUTH" "$API?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id' | head -n1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data "$(jq -cn --arg t "$KV_TITLE" '{title: $t}')" "$API" | jq -r '.result.id')
            echo "KV alanı oluşturuldu."
          fi
          if ! printf '%s' "$ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::KV alanı bulunamadı/oluşturulamadı. API jetonunda 'Workers KV Storage: Edit' izni olmalı."; exit 1
          fi
          sed -i "s/KV_NAMESPACE_ID_PLACEHOLDER/$ID/" server/wrangler.toml
          grep -q "$ID" server/wrangler.toml

      - name: Dağıt
        if: env.HAS_CF == 'true'
        working-directory: server
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n1 || true)
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      # Gizli değerler: GitHub Secrets'ta varsa yüklenir (yoksa mevcut değer korunur).
      - name: Gizli değerleri yükle
        if: env.HAS_CF == 'true'
        working-directory: server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx --yes "$WRANGLER" secret put "$1" >/dev/null && echo "$1 yüklendi."; }
          EXISTING=$(npx --yes "$WRANGLER" secret list 2>/dev/null || echo '[]')
          has() { printf '%s' "$EXISTING" | grep -q "\"$1\""; }
          if [ -n "$GEMINI_API_KEY" ]; then put GEMINI_API_KEY "$GEMINI_API_KEY"
          elif ! has GEMINI_API_KEY; then echo "::warning::GEMINI_API_KEY yok — çeviri çalışmaz."; fi
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then put GOOGLE_SERVICE_ACCOUNT_JSON "$GOOGLE_SERVICE_ACCOUNT_JSON"
          elif ! has GOOGLE_SERVICE_ACCOUNT_JSON; then echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON yok — abonelik doğrulanamaz."; fi
          if [ -n "$SESSION_SECRET" ]; then put SESSION_SECRET "$SESSION_SECRET"
          elif ! has SESSION_SECRET; then
            GEN=$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')
            echo "::add-mask::$GEN"
            put SESSION_SECRET "$GEN"
            echo "SESSION_SECRET otomatik üretildi (Cloudflare'de saklanıyor)."
          fi

      - name: Sağlık kontrolü
        if: env.HAS_CF == 'true'
        run: |
          if [ -z "${WORKER_URL:-}" ]; then
            echo "::warning::Worker adresi günlükte bulunamadı. Cloudflare > Workers & Pages > altyazitr-api sayfasına bakın."; exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$WORKER_URL/v1/health"; then echo; break; fi
            sleep 5
          done
          {
            echo "### AltyazıTR Pro sunucusu dağıtıldı"
            echo ""
            echo "API adresi (GitHub'da **PRO_API_BASE_URL** gizli değerine bunu yazın):"
            echo ""
            echo "\`$WORKER_URL\`"
            echo ""
            echo "Test: $WORKER_URL/v1/health"
          } >> "$GITHUB_STEP_SUMMARY"
