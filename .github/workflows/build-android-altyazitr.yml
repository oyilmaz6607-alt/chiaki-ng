# AltyazıTR Oyun — Google TV / Android derlemesi
# Actions > Android (AltyazıTR) > "Run workflow" ile elle de başlatılabilir.
name: Android (AltyazıTR)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'lib/**'
      - '.github/workflows/build-android-altyazitr.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Tüm hazırlık + derleme tek adımda; çıktı günlüğe yazılır, hata olursa özeti not olarak eklenir
      - name: Hazırla ve derle
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          summarize() {
            body=$( (grep -n -i -E "error|failed|what went wrong|exception|not found|cannot|denied" "$LOG" | tail -n 30; echo '--- son satirlar ---'; tail -n 30 "$LOG") | cut -c1-300 )
            body="${body//'%'/'%25'}"; body="${body//$'\r'/}"; body="${body//$'\n'/'%0A'}"
            echo "::error title=Derleme hatasi::$body"
          }
          trap 'summarize' ERR
          set -e
          {
            echo "== alt moduller =="
            git submodule update --init --depth 1 \
              third-party/nanopb third-party/jerasure third-party/gf-complete \
              third-party/curl android/app/src/main/cpp/oboe

            echo "== protoc =="
            sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
            protoc --version

            echo "== python protobuf =="
            python3 -m pip install --user --break-system-packages 'protobuf>=5,<6'

            echo "== android sdk =="
            echo "ANDROID_HOME=$ANDROID_HOME"
            SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)
            echo "sdkmanager: $SDKM"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
              {
                echo "chiakiKeystore=$RUNNER_TEMP/upload.jks"
                echo "chiakiKeystorePW=$KEYSTORE_PASSWORD"
                echo "chiakiKeyAlias=$KEY_ALIAS"
                echo "chiakiKeyPW=$KEY_PASSWORD"
              } > android/local.properties
              TASKS="testDebugUnitTest assembleDebug bundleRelease assembleRelease"
            else
              # İmza anahtarı yoksa: TV'de denemek için doğrudan kurulabilen test APK'sı
              TASKS="testDebugUnitTest assembleDebug"
            fi

            echo "== gradle: $TASKS =="
            cd android
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace $TASKS
          } 2>&1 | tee "$LOG"

      - uses: actions/upload-artifact@v4
        with:
          name: altyazitr-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
