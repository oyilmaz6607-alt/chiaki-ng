# AltyazıTR Oyun — Google TV / Android derlemesi
# GitHub'a push edince otomatik çalışır; Actions > bu workflow > "Run workflow" ile elle de başlatılabilir.
# Çıktılar: imzalı .aab (Play Store'a yüklenecek) ve .apk (TV'ye doğrudan kurup denemek için).
name: Android (AltyazıTR)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'lib/**'
      - '.github/workflows/build-android-altyazitr.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python ve protobuf (nanopb için)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ninja-build
          pip3 install --user 'protobuf>=5,<6' --break-system-packages

      - name: Android NDK ve CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: İmza anahtarını hazırla
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "chiakiKeystore=$RUNNER_TEMP/upload.jks"
            echo "chiakiKeystorePW=$KEYSTORE_PASSWORD"
            echo "chiakiKeyAlias=$KEY_ALIAS"
            echo "chiakiKeyPW=$KEY_PASSWORD"
          } > android/local.properties

      - name: Uygulamayı derle
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew --no-daemon testDebugUnitTest assembleDebug bundleRelease assembleRelease
          else
            # İmza anahtarı yoksa: TV'de denemek için doğrudan kurulabilen test APK'sı
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: altyazitr-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
